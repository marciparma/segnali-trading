name: Segnali trading

on:
  schedule:
    # Orari in UTC, lunedì-venerdì, ogni 5 minuti.
    # 07-10 UTC copre l'apertura di Londra (9:00 italiane, anche con l'ora legale).
    # 13-21 UTC copre la seduta USA (15:30-22:00 italiane) e la chiusura di Londra.
    - cron: "*/5 7-10 * * 1-5"
    - cron: "*/5 13-21 * * 1-5"
    # Una volta all'ora, tutti i giorni: legge i tuoi messaggi (+17,80 / -9,10 / saldo)
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Manda solo un messaggio di prova su Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: segnali
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # sempre l'ultima versione, anche se rilanci un'esecuzione vecchia

      - name: Controlla i grafici e manda i segnali
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SALDO_EUR: ${{ secrets.SALDO_EUR }}
          TEST: ${{ github.event.inputs.test }}
        run: python3 segnali.py

      - name: Salva avvisi mandati e saldo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add stato.json conto.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "stato segnali"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
